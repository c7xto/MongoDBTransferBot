name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -U pip && python -m pip install -r requirements-dev.txt ruff pip-audit
      - name: Compile
        run: python -m compileall -q .
      - name: Critical lint checks
        run: python -m ruff check . --select E9,F63,F7,F82
      - name: Tests
        run: python -m pytest -q
      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.txt
